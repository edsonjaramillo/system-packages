version: "3"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  fmt:nix:
    desc: Format all Nix files
    cmds:
      - alejandra .

  check:
    desc: Check all package sources
    cmds:
      - task: check:nix
      - task: check:brew

  check:nix:
    desc: Validate Nix package bundles for all supported systems
    cmds:
      - nix flake check ./nix --all-systems

  check:brew:
    desc: Check whether all Brewfile dependencies are installed
    platforms: [darwin]
    cmds:
      - brew bundle check --verbose --file brew/Brewfile

  build:nix:
    desc: Build the Nix package bundle for this system
    cmds:
      - nix build path:./nix#default --no-link --print-build-logs

  install:
    desc: Install all package sources
    cmds:
      - task: install:nix
      - task: install:brew
      - task: install:bun

  install:nix:
    desc: Install the package bundle into the Nix profile
    cmds:
      - nix profile upgrade --all

  install:brew:
    desc: Install and upgrade Brewfile dependencies
    platforms: [darwin]
    cmds:
      - brew bundle install --file brew/Brewfile

  install:bun:
    desc: Install dependencies from the Bun lockfile
    dir: bun
    cmds:
      - bun install --frozen-lockfile

  update:
    desc: Update package sources, validate, and install them
    cmds:
      - task: update:nix
      - task: update:bun
      - task: check
      - task: install

  update:nix:
    desc: Update flake inputs
    cmds:
      - nix flake update --flake ./nix

  update:bun:
    desc: Update Bun dependencies and lockfile
    dir: bun
    cmds:
      - bun update

  outdated:bun:
    desc: List outdated Bun dependencies
    dir: bun
    cmds:
      - bun outdated

  list:bun:
    desc: List dependencies from the Bun lockfile
    dir: bun
    cmds:
      - bun list

  list:brew:
    desc: List dependencies declared in the Brewfile
    platforms: [darwin]
    cmds:
      - brew bundle list --all --file brew/Brewfile

  cleanup:brew:
    desc: Uninstall Homebrew dependencies not declared in the Brewfile
    prompt: Uninstall Homebrew dependencies not declared in the Brewfile?
    platforms: [darwin]
    cmds:
      - brew bundle cleanup --force --file brew/Brewfile

  profile:nix:
    desc: Show packages installed in the active Nix profile
    cmds:
      - nix profile list

  history:nix:
    desc: Show Nix profile generations
    cmds:
      - nix profile history

  rollback:nix:
    desc: Roll back to the previous Nix profile generation
    prompt: Roll back the active Nix profile?
    cmds:
      - nix profile rollback
