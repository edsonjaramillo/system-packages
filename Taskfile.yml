version: "3"

includes:
  nix:
    taskfile: ./nix
    dir: ./nix
  brew:
    taskfile: ./brew
    dir: ./brew
  npm:
    taskfile: ./npm
    dir: ./npm
  bun:
    taskfile: ./bun
    dir: ./bun

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  check:
    desc: Check all package sources
    cmds:
      - task: nix:check
      - task: brew:check

  install:
    desc: Install all package sources
    cmds:
      - task: nix:install
      - task: brew:install
      - task: npm:install
      - task: bun:install

  update:
    desc: Update package sources, validate, and install them
    cmds:
      - task: nix:update
      - task: npm:update
      - task: bun:update
      - task: check
      - task: install
